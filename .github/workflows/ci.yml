name: ci
on:
  push:
    branches: [main]
  pull_request:

# Scoped down rather than inheriting the repository default: nothing in this
# job writes anywhere, and a public repo should say so explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: source must be ASCII-only (see Global Constraints)
        run: |
          if grep -rP '[^\x00-\x7F]' src scripts; then
            echo "::error::non-ASCII byte in source; use an escape like \\u00a0 instead"
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: node --test src/*.test.ts
      # Build the image on every push, not only at release time. The Dockerfile
      # is the one part of the project CI would otherwise never exercise, so a
      # break in it would first surface on the public release path.
      - name: image must build and refuse to start without configuration
        run: |
          docker build -t instagram-titles:ci .
          set +e
          docker run --rm instagram-titles:ci
          status=$?
          set -e
          test "$status" -eq 2 || { echo "::error::image exited $status, expected 2"; exit 1; }
