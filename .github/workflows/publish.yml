name: publish
on:
  push:
    tags: ["v*"]

jobs:
  # A tag can point at any commit, including one CI never saw. Without this the
  # release path is the only path that never runs the checks -- and it is the
  # one that publishes to :latest, where other people pull from.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - name: source must be ASCII-only (see Global Constraints)
        run: |
          if grep -rP '[^\x00-\x7F]' src scripts; then
            echo "::error::non-ASCII byte in source; use an escape like \\u00a0 instead"
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: node --test src/*.test.ts

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/rcarvalhoxavier/instagram-titles
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
