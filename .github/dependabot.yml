# Dependabot keeps two things current here.
#
# The npm entry covers the two development dependencies and, since the
# extraction to instagram-caption, one runtime dependency too - Dependabot
# will open pull requests against it like any other. The github-actions entry
# is what makes pinning the workflow actions by moving tag defensible: the
# tags move, and Dependabot opens the pull request when they do, so the
# project gets the maintenance without anyone having to remember it.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
