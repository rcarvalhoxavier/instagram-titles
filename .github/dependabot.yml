# Dependabot keeps two things current here.
#
# The npm entry covers the two development dependencies; there are no runtime
# dependencies to update. The github-actions entry is what makes pinning the
# workflow actions by moving tag defensible: the tags move, and Dependabot
# opens the pull request when they do, so the project gets the maintenance
# without anyone having to remember it.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
